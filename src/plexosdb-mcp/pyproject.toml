[project]
name = "plexosdb-mcp"
version = "0.1.0"
description = "Model Context Protocol server package for plexosdb"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "plexosdb maintainers" },
]
dependencies = [
    "plexosdb>=1.3.4",
    "fastmcp>=3.0.0",
]

[project.scripts]
plexosdb-mcp = "plexosdb_mcp.__main__:main"

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plexosdb_mcp"]

[tool.uv.sources]
plexosdb = { path = "../../", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
